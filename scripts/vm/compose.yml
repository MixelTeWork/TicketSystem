services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: manual-root-20261025
      MYSQL_DATABASE: ticketsystem_manual
      MYSQL_USER: ticketsystem
      MYSQL_PASSWORD: manual-db-20261025
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: scripts/vm/Dockerfile
    environment:
      DBPATH: ticketsystem:manual-db-20261025@mysql:3306/ticketsystem_manual
    ports:
      - "8080:5001"
    volumes:
      - app-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/login', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: unless-stopped
volumes:
  mysql-data:
  app-storage:
