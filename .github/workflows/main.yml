name: Test and deploy

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root
          MYSQL_DATABASE: ticketsystem_test
          MYSQL_USER: ticketsystem
          MYSQL_PASSWORD: ticketsystem
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DBPATH: ticketsystem:ticketsystem@127.0.0.1:3306/ticketsystem_test
      TEST_MYSQL_DBPATH: ticketsystem:ticketsystem@127.0.0.1:3306/ticketsystem_test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install backend test dependencies
      working-directory: backend
      run: python -m pip install -r requirements-dev.txt
    - name: Verify migrations from an empty MySQL database
      working-directory: backend
      run: |
        python -m bafser alembic upgrade --prod
    - name: Run backend tests on MySQL
      working-directory: backend
      run: >-
        python -m pytest
        -m "not release_migration"
        --cov=blueprints --cov=data --cov=utils
        --cov-branch
        --cov-report=term-missing
        --cov-fail-under=90
        -W error::DeprecationWarning
        -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Check frontend
      run: |
        cd frontend
        npm ci
        npm run lint
        npm test
        npm run build
    - name: Move build to backend
      if: github.event_name == 'push'
      run: mv frontend/build backend/
    - name: Deploy with gh-pages
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: backend
